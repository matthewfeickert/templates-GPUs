[workspace]
channels = ["conda-forge"]
name = "multi_gpu"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
pytorch-gpu = ">=2.8.0,<3"
torchvision = ">=0.24.0,<0.25"
torchaudio = ">=2.8.0,<3"
cuda-version = ">=12.9,<13"

[system-requirements]
cuda = "12.9"

[feature.profile.dependencies]
wandb = ">=0.22.3,<0.23"

[environments]
profile = ["profile"]
